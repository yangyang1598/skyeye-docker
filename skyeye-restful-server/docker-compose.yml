version: '3'
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "4001:4001"
    volumes:
      - ./skyeye-restful-server:/skyeye-docker-server
      - ./nginx:/etc/nginx/conf.d
      - ./skyeye-restful-server/static:/static
      - ./skyeye-restful-server/media:/media
    depends_on:
      - web
  web:
    build:
      context: ./skyeye-restful-server
      dockerfile: Dockerfile
    container_name: skyeye-restapi
    # command: gunicorn server.wsgi:application --bind 0.0.0.0:4001
    command: daphne -b 0.0.0.0 -p 4001 server.asgi:application
    volumes:
      - ./skyeye-restful-server:/skyeye-docker-server
      - ./skyeye-restful-server/static:/static
      - ./skyeye-restful-server/media:/media
    ports:
      - "4001"
